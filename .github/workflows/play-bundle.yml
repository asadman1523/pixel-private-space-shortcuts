name: Build Play upload bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-upload-bundle
  cancel-in-progress: false

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate source before signing
        run: |
          python3 -X utf8 tools/check_docs.py
          ./gradlew --no-configuration-cache testDebugUnitTest lintDebug assembleDebug lintRelease
      - name: Restore upload keystore
        env:
          PPSS_KEYSTORE_BASE64: ${{ secrets.PPSS_KEYSTORE_BASE64 }}
        run: |
          python3 -X utf8 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get("PPSS_KEYSTORE_BASE64", "")
          if not encoded:
              raise SystemExit("Missing PPSS_KEYSTORE_BASE64 secret")
          path = Path(os.environ["RUNNER_TEMP"]) / "ppss-upload.p12"
          with open(path, "xb", opener=lambda p, flags: os.open(p, flags, 0o600)) as output:
              output.write(base64.b64decode(encoded, validate=True))
          PY
      - name: Build signed Play upload bundle
        env:
          PPSS_KEYSTORE: ${{ runner.temp }}/ppss-upload.p12
          PPSS_STORE_PASSWORD: ${{ secrets.PPSS_STORE_PASSWORD }}
          PPSS_KEY_ALIAS: ${{ secrets.PPSS_KEY_ALIAS }}
          PPSS_KEY_PASSWORD: ${{ secrets.PPSS_KEY_PASSWORD }}
        run: |
          test -n "$PPSS_STORE_PASSWORD" && test -n "$PPSS_KEY_ALIAS" && test -n "$PPSS_KEY_PASSWORD"
          ./gradlew --no-configuration-cache bundleRelease
      - name: Verify bundle signature and record checksum
        run: |
          bundle=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle"
          keytool -J-Duser.language=en -printcert -jarfile "$bundle" > "$RUNNER_TEMP/ppss-bundle-certificate.txt"
          grep -F 'SHA256: 6B:1B:FF:92:FE:CA:83:D8:89:39:AF:20:B0:4E:7A:38:0A:6F:E7:A8:92:0A:25:E9:1F:A0:FA:F1:75:00:5C:56' "$RUNNER_TEMP/ppss-bundle-certificate.txt"
          (cd app/build/outputs/bundle/release && sha256sum app-release.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-upload-bundle-${{ github.sha }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ppss-upload.p12" "$RUNNER_TEMP/ppss-bundle-certificate.txt"
